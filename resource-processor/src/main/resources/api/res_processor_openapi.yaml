openapi: 3.0.3
info:
  title: Resource Processor API
  version: 1.0.0
servers:
  - url: http://localhost:8082

paths:
  /extract:
    post:
      summary: Extract metadata from an MP3 file
      operationId: extractAudio
      requestBody:
        required: true
        content:
          applicatio/json:
            schema:
              $ref: '#/components/schemas/SongDataRecord'
      responses:
        '200':
          description: MP3 file extracted successfully
          content:
            applicatio/json:
              schema:
                $ref: '#/components/schemas/SongMetadataRecord'
        '400':
          description: Invalid MP3 file

components:
  schemas:
    SongDataRecord:
      type: object
      required:
        - id
        - data
      properties:
        id:
          type: integer
          format: int64
          description: ID of the audio resource
        data:
          type: string
          format: binary
          description: Audio resource
    SongMetadataRecord:
      type: object
      required:
        - id
        - name
        - artist
        - album
        - duration
        - year
      properties:
        id:
          type: integer
          format: int64
          description: ID of the audio resource
        name:
          type: string
          description: Song name
          minLength: 1
          maxLength: 100
        artist:
          type: string
          description: Artist name
          minLength: 1
          maxLength: 100
        album:
          type: string
          description: Album name
          minLength: 1
          maxLength: 100
        duration:
          type: string
          description: Song duration in mm:ss format, with leading zeros
          pattern: '^[0-9]{2}:[0-5][0-9]$'
        year:
          type: string
          description: YYYY format between 1900-2099
          pattern: '^(19[0-9]{2}|20[0-9]{2})$'