server:
  port: 8082

spring:
  application:
    name: resource-processor
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:user}
    password: ${RABBITMQ_PASSWORD:password}
  cloud:
    stream:
      bindings:
        resourceUploaded-in-0:
          destination: resource.exchange
          group: resource.uploaded.queue
          content-type: application/json
          consumer:
            bindingRoutingKey: resource.uploaded
            max-attempts: 1
      rabbit:
        bindings:
          resourceUploaded-in-0:
            consumer:
              auto-bind-dlq: true


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

song-srv:
  url: ${SONG_SERVICE_URL:http://song-service}

resource-srv:
  url: ${RESOURCE_SERVICE_URL:http://resource-service}