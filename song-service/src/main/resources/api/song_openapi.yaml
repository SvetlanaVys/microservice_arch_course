openapi: 3.0.3
info:
  title: Song API
  description: API for
  version: 1.0.0
servers:
  - url: http://localhost:8081

paths:
  /songs:
    post:
      summary: Creates a new song.
      operationId: createSong

      parameters:
        - name: X-Source-Service
          in: header
          required: false
          description: Identifies the service that initiated the request
          schema:
            type: string
            example: resource-srv

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongMetadataRecord'
      responses:
        '200':
          description: Metadata created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSongResponse'
        '400':
          description: Song metadata is missing or contains errors
        '409':
          description: Metadata for this ID already exists
        '500':
          description: n error occurred on the server
    delete:
      summary: Deletes specified song metadata records by their IDs. If a metadata record does not exist, it is ignored without causing an error
      operationId: deleteSongs
      parameters:
        - name: id
          in: query
          required: true
          description: Comma-separated list of metadata IDs to remove
          schema:
            type: string
            example: "1,2"
      responses:
        '200':
          description: Request successful, metadata records deleted as specified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRecordResponse'
        '400':
          description: CSV string format is invalid or exceeds length restrictions.
        '500':
          description: An error occurred on the server

  /songs/{id}:
    get:
      tags:
        - Songs
      summary: Get song metadata by ID
      operationId: getSong
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the metadata to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Metadata retrieved successfull
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongMetadataRecord'
        '400':
          description: The provided ID is invalid (e.g., contains letters, decimals, is negative, or zero)
        '404':
          description: Song metadata with the specified ID does not exist
        '500':
          description: An error occurred on the server

components:
  schemas:
    SongMetadataRecord:
      type: object
      required:
        - id
        - name
        - artist
        - album
        - duration
        - year
      properties:
        id:
          type: integer
          format: int64
          description: ID of the audio resource
        name:
          type: string
          description: Song name
          minLength: 1
          maxLength: 100
        artist:
          type: string
          description: Artist name
          minLength: 1
          maxLength: 100
        album:
          type: string
          description: Album name
          minLength: 1
          maxLength: 100
        duration:
          type: string
          description: Song duration in mm:ss format, with leading zeros
          pattern: '^[0-9]{2}:[0-5][0-9]$'
        year:
          type: string
          description: YYYY format between 1900-2099
          pattern: '^(19[0-9]{2}|20[0-9]{2})$'
    UploadSongResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: Returns the ID of the successfully created metadata record (should match the Resource ID)

    DeleteRecordResponse:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [ 1, 2 ]
          description: Returns an array of the IDs of successfully deleted metadata records.

