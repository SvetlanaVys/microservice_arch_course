spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: song-service
              uri: lb://song-service
              predicates:
                - Path=/songs/**
            - id: resource-service
              uri: lb://resource-service
              predicates:
                - Path=/resources/**
            - id: resource-processor
              uri: lb://resource-processor
              predicates:
                - Path=/processor/**
server:
  port: 8085
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true